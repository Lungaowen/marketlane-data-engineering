services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: marketlane
      RABBITMQ_DEFAULT_PASS: marketlane
    ports:
      - "5672:5672"
      - "15672:15672"

  warehouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: warehouse
      CLICKHOUSE_USER: marketlane
      CLICKHOUSE_PASSWORD: marketlane
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - warehouse_data:/var/lib/clickhouse
      - ./warehouse/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  consumer:
    build: .
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: marketlane
      RABBITMQ_PASSWORD: marketlane
      RABBITMQ_QUEUE: marketlane.events
      CLICKHOUSE_HOST: warehouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: marketlane
      CLICKHOUSE_PASSWORD: marketlane
      CLICKHOUSE_DATABASE: warehouse
    depends_on:
      - rabbitmq
      - warehouse

  producer:
    build: .
    command: ["python", "scripts/publish_sample_event.py"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: marketlane
      RABBITMQ_PASSWORD: marketlane
      RABBITMQ_QUEUE: marketlane.events
    depends_on:
      - rabbitmq

volumes:
  warehouse_data:
